[package]
name = "a2app-agent"
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
description = "AI agent integration for Robrix's mini-app support: an ACP client for spawning agents like `octos acp`, the generation/repair pipeline, provider/model selection, and an optional in-process octos backend."
edition = "2024"
license = "MIT"
repository = "https://github.com/project-robius/robrix"
version = "0.1.0"

[dependencies]
a2app-core = { path = "../core" }

## Inherits Robrix's own makepad pin from the workspace root.
makepad-widgets = { workspace = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

## Both agent backends use the same host-owned model transport and types.
## Only the in-process backend links the Octos agent, CLI, and memory crates.
## Pin upstream #2443 plus the SQLite host compatibility update in #2455.
octos-agent = { git = "https://github.com/octos-org/octos", rev = "bf63797a11b3949f4a726267a91d22bf977e7c01", default-features = false, optional = true }
octos-core  = { git = "https://github.com/octos-org/octos", rev = "bf63797a11b3949f4a726267a91d22bf977e7c01" }
octos-cli   = { git = "https://github.com/octos-org/octos", rev = "bf63797a11b3949f4a726267a91d22bf977e7c01", default-features = false, features = ["api"], optional = true }
octos-llm   = { git = "https://github.com/octos-org/octos", rev = "bf63797a11b3949f4a726267a91d22bf977e7c01" }
octos-memory = { git = "https://github.com/octos-org/octos", rev = "bf63797a11b3949f4a726267a91d22bf977e7c01", optional = true }
octos-sandbox = { git = "https://github.com/octos-org/octos", rev = "bf63797a11b3949f4a726267a91d22bf977e7c01" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
eyre = { version = "0.6" }
sha2 = { version = "0.10" }
getrandom = { version = "0.3" }
tempfile = "3"
url = { version = "2.5" }
## Unprotected standalone agents can expose Octos diagnostics in debug builds.
## Protected session threads suppress dependency tracing.
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing = { version = "0.1", optional = true }
tokio  = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
chrono = { version = "0.4" }
async-trait = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
## Match the home-directory resolver used by Octos's Linux secret store.
dirs = "6"

[features]
## Link the Octos agent into Robrix instead of using the protected ACP child.
## Both paths route model calls through Robrix's guarded transport.
embedded = ["dep:octos-agent", "dep:octos-cli", "dep:octos-memory", "dep:tracing-subscriber", "dep:tracing"]

## Install the Splash dialect guide ON THE AGENT once, so each prompt can
## point at it instead of inlining ~6KB of guide per generation.
persistent-guide = []

## Allow the agent to research with its tools (web search/fetch) before
## answering, baking found data into the generated app as constants.
research = []

## A deterministic offline stand-in agent for tests: speaks just enough ACP,
## picks its scenario from the prompt text. Inject via ROBRIX_AGENT_CMD.
[[bin]]
name = "fake_acp"
path = "src/bin/fake_acp.rs"

[lints]
workspace = true
